name: Daily Entry Check

on:
  schedule:
    # 07:00 JST = 22:00 UTC (previous day)
    - cron: "0 22 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: keiba-data-writer
  queue: max
  cancel-in-progress: false

jobs:
  daily-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Refresh weekly race list
        run: npm run refresh:weekly-races

      - name: Refresh keiba data
        run: node scripts/weekly-keiba-update.mjs --force

      - name: Apply entry/training corrections
        run: node scripts/daily-entry-check.mjs

      - name: Sync generated schedule
        run: node scripts/sync-race-schedule.mjs

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/weekly-races.json lib/generatedTrainingData.ts lib/generatedNetkeibaData.ts lib/generatedRaceSchedule.ts lib/generatedDrawOverrides.ts
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "chore: daily 7am entry/training sync"
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            if [ -d .git/rebase-merge ] || [ -d .git/rebase-apply ]; then
              git rebase --abort
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep "$((attempt * 2))"
            fi
          done
          echo "Failed to rebase and push after 3 attempts." >&2
          exit 1

      - name: Preserve generated data after failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: keiba-daily-data-${{ github.run_id }}
          retention-days: 7
          if-no-files-found: ignore
          path: |
            data/weekly-races.json
            lib/generatedTrainingData.ts
            lib/generatedNetkeibaData.ts
            lib/generatedRaceSchedule.ts
            lib/generatedDrawOverrides.ts
