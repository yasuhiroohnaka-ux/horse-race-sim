name: Keiba Routine Automation

on:
  schedule:
    # JST: Sun 09:00 / Mon 09:00 / Mon 10:00 / Wed 12:00 / Thu 12:00 / Thu 15:00 / Fri 10:30 / Sat 15:00 / Sun 15:00 / Sun 16:00
    - cron: "0 0 * * 0"
    - cron: "0 0 * * 1"
    - cron: "0 1 * * 1"
    - cron: "0 3 * * 3"
    - cron: "0 3 * * 4"
    - cron: "0 6 * * 4"
    - cron: "30 1 * * 5"
    - cron: "0 6 * * 6"
    - cron: "0 6 * * 0"
    - cron: "0 7 * * 0"
  workflow_dispatch:
    inputs:
      stage:
        description: "Optional manual stage (sun_09, mon_09, mon_10, wed_12, thu_12, thu_15, fri_10, sat_15, sun_15, sun_16)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  routine:
    runs-on: ubuntu-latest
    env:
      X_POST_WEBHOOK_URL: ${{ secrets.X_POST_WEBHOOK_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve routine stage
        id: resolve-stage
        shell: bash
        run: |
          stage="${{ github.event.inputs.stage }}"
          if [ -z "$stage" ]; then
            case "${{ github.event.schedule }}" in
              "0 0 * * 0") stage="sun_09" ;;
              "0 0 * * 1") stage="mon_09" ;;
              "0 1 * * 1") stage="mon_10" ;;
              "0 3 * * 3") stage="wed_12" ;;
              "0 3 * * 4") stage="thu_12" ;;
              "0 6 * * 4") stage="thu_15" ;;
              "30 1 * * 5") stage="fri_10" ;;
              "0 6 * * 6") stage="sat_15" ;;
              "0 6 * * 0") stage="sun_15" ;;
              "0 7 * * 0") stage="sun_16" ;;
              *)
                echo "Unable to resolve stage from schedule: '${{ github.event.schedule }}'"
                exit 1
                ;;
            esac
          fi
          echo "stage=$stage" >> "$GITHUB_OUTPUT"

      - name: Run routine
        run: npm run routine:keiba -- --stage=${{ steps.resolve-stage.outputs.stage }}

      - name: Run review self-heal
        run: npm run review:pipeline -- --include-archives

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/weekly-races.json data/routine-state.json data/pending-posts.jsonl data/review-records.json data/prediction-snapshots.jsonl lib/generatedNetkeibaData.ts lib/generatedTrainingData.ts lib/generatedRaceSchedule.ts lib/generatedRaceVolatility.ts lib/generatedDrawOverrides.ts
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore: routine keiba update"
          git push
