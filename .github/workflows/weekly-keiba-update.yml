name: Keiba Routine Automation

on:
  schedule:
    # JST:
    # Mon 10:00 / Wed 12:00 / Thu 12:00 / Thu 15:00 / Fri 10:00 / Sat 15:00 / Sun 15:00 / Sun 16:00
    - cron: "0 1 * * 1"
    - cron: "0 3 * * 3"
    - cron: "0 3 * * 4"
    - cron: "0 6 * * 4"
    - cron: "0 1 * * 5"
    - cron: "0 6 * * 6"
    - cron: "0 6 * * 0"
    - cron: "0 7 * * 0"
  workflow_dispatch:
    inputs:
      stage:
        description: "Optional manual stage (mon_10, wed_12, thu_12, thu_15, fri_10, sat_15, sun_15, sun_16)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  routine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run routine
        run: |
          if [ -n "${{ github.event.inputs.stage }}" ]; then
            npm run routine:keiba -- --stage=${{ github.event.inputs.stage }}
          else
            npm run routine:keiba -- --auto
          fi

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/weekly-races.json data/routine-state.json data/pending-posts.jsonl lib/generatedNetkeibaData.ts lib/generatedTrainingData.ts lib/generatedRaceSchedule.ts lib/generatedRaceVolatility.ts lib/generatedDrawOverrides.ts
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore: routine keiba update"
          git push
