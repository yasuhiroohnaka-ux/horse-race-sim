name: Keiba Routine Automation

on:
  schedule:
    # JST: Sat/Sun 09:00, 13:00, 14:00, 15:00, 16:00 plus weekday routine stages.
    - cron: "0 0 * * 6"
    - cron: "0 0 * * 0"
    - cron: "0 0 * * 1"
    - cron: "0 1 * * 1"
    - cron: "0 3 * * 3"
    - cron: "0 3 * * 4"
    - cron: "0 6 * * 4"
    - cron: "30 1 * * 5"
    - cron: "0 6 * * 6"
    - cron: "0 6 * * 0"
    - cron: "0 4 * * 6"
    - cron: "0 4 * * 0"
    - cron: "0 5 * * 6"
    - cron: "0 5 * * 0"
    - cron: "0 7 * * 6"
    - cron: "0 7 * * 0"
    - cron: "0 9 * * 0"
  workflow_dispatch:
    inputs:
      stage:
        description: "Optional manual stage (sat_09/13/14/15/16, sun_09/13/14/15/16, mon_09/10, wed_12, thu_12/15, fri_10, sun_18)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  routine:
    runs-on: ubuntu-latest
    env:
      X_POST_WEBHOOK_URL: ${{ secrets.X_POST_WEBHOOK_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve routine stage
        id: resolve-stage
        shell: bash
        run: |
          stage="${{ github.event.inputs.stage }}"
          if [ -z "$stage" ]; then
            case "${{ github.event.schedule }}" in
              "0 0 * * 6") stage="sat_09" ;;
              "0 0 * * 0") stage="sun_09" ;;
              "0 0 * * 1") stage="mon_09" ;;
              "0 1 * * 1") stage="mon_10" ;;
              "0 3 * * 3") stage="wed_12" ;;
              "0 3 * * 4") stage="thu_12" ;;
              "0 6 * * 4") stage="thu_15" ;;
              "30 1 * * 5") stage="fri_10" ;;
              "0 6 * * 6") stage="sat_15" ;;
              "0 6 * * 0") stage="sun_15" ;;
              "0 4 * * 6") stage="sat_13" ;;
              "0 4 * * 0") stage="sun_13" ;;
              "0 5 * * 6") stage="sat_14" ;;
              "0 5 * * 0") stage="sun_14" ;;
              "0 7 * * 6") stage="sat_16" ;;
              "0 7 * * 0") stage="sun_16" ;;
              "0 9 * * 0") stage="sun_18" ;;
              *)
                echo "Unable to resolve stage from schedule: '${{ github.event.schedule }}'"
                exit 1
                ;;
            esac
          fi
          echo "stage=$stage" >> "$GITHUB_OUTPUT"
          case "$stage" in
            sat_09|sat_13|sat_14|sat_15|sat_16|sun_09|sun_13|sun_14|sun_15|sun_16)
              echo "captureSignals=true" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Capture afternoon pre-race signals
        if: steps.resolve-stage.outputs.captureSignals == 'true' && steps.resolve-stage.outputs.stage != 'sat_09' && steps.resolve-stage.outputs.stage != 'sun_09'
        run: npm run capture:pre-race-signals

      - name: Run routine
        run: npm run routine:keiba -- --stage=${{ steps.resolve-stage.outputs.stage }}

      - name: Capture morning pre-race signals
        if: steps.resolve-stage.outputs.stage == 'sat_09' || steps.resolve-stage.outputs.stage == 'sun_09'
        run: npm run capture:pre-race-signals

      - name: Capture Saturday live pre-race snapshots
        if: steps.resolve-stage.outputs.stage == 'sat_09'
        run: npm run review:snapshot -- --day=Sat --force-retry-now

      - name: Capture Sunday live pre-race snapshots
        if: steps.resolve-stage.outputs.stage == 'sun_09'
        run: npm run review:snapshot -- --day=Sun --force-retry-now

      - name: Run review self-heal
        run: npm run review:pipeline -- --include-archives

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/weekly-races.json data/routine-state.json data/pending-posts.jsonl data/pre-race-signals.jsonl data/review-records.json data/prediction-snapshots.jsonl data/analysis/calibration-report.md data/analysis/calibration-report.json lib/generatedNetkeibaData.ts lib/generatedTrainingData.ts lib/generatedRaceSchedule.ts lib/generatedRaceVolatility.ts lib/generatedDrawOverrides.ts
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore: routine keiba update"
          git push
